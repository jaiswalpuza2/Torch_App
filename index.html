<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport: prevent zoom, fill the screen edge-to-edge -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>Flashlight Pro™</title>

    <!-- ── PWA manifest ── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Theme color (browser chrome on Android) ── -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- ── iOS PWA / Safari ── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flashlight Pro" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />

    <!-- ── MS Tile (optional but harmless) ── -->
    <meta name="msapplication-TileColor" content="#0a0a0a" />
    <meta name="msapplication-TileImage" content="/icon-192.svg" />

    <!-- ── Description for install dialogs ── -->
    <meta name="description" content="The world's most premium flashlight app. $499 to turn it off." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
